.app{
  --bg:#03081A; --panel:rgba(14,24,64,.6); --raised:rgba(30,44,104,.5);
  --line:rgba(140,162,232,.20); --line2:rgba(140,162,232,.36); --soft:rgba(140,162,232,.12);
  --ink:#FFFFFF; --ink2:#D4DCF8; --ink3:#96A5DC; --hot:#FF8A6B;
  --kr:#FF7D6B; --us:#78B8FF; --jp:#FFD07A; --eu:#6FE5C1;
  --sans:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:ui-monospace,"SF Mono","JetBrains Mono","Roboto Mono",Menlo,monospace;
  background:
    radial-gradient(1100px 520px at 12% -12%, rgba(70,124,225,.18), transparent 62%),
    radial-gradient(860px 460px at 92% -4%, rgba(110,86,225,.15), transparent 60%),
    linear-gradient(180deg,#071030 0%,#040A22 46%,#02050F 100%);
  background-attachment:fixed;
  color:var(--ink); font-family:var(--sans);
  font-size:13px; line-height:1.5; min-height:100vh; padding:0 0 60px;
  -webkit-font-smoothing:antialiased;
}
.app *{box-sizing:border-box}
.app button{font-family:inherit;font-size:12px;cursor:pointer;border:none;background:none;color:inherit}
.app input,.app select,.app textarea{
  font-family:inherit;font-size:12.5px;background:rgba(2,6,22,.6);color:var(--ink);
  border:1px solid var(--line);border-radius:6px;padding:6px 9px;width:100%;outline:none;
}
.app input::placeholder,.app textarea::placeholder{color:#7080B8}
.app textarea{font-family:var(--mono);font-size:12px;line-height:1.6;resize:vertical}
.app input:focus,.app select:focus,.app textarea:focus{border-color:#7FA8FF;box-shadow:0 0 0 3px rgba(99,172,255,.18)}
.app h1,.app h2,.app h3{margin:0;font-weight:600}

/* \uD5E4\uB354 */
.top{display:flex;align-items:flex-start;gap:28px;padding:20px 22px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand h1{font-size:16px;letter-spacing:-.01em;
  background:linear-gradient(92deg,#FFFFFF 0%,#EAF1FF 55%,#C7D8FF 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.brand .wk{font-family:var(--mono);font-size:11px;color:var(--ink3);display:block;margin-top:3px}
.metrics{display:flex;gap:26px;flex:1;flex-wrap:wrap}
.metric{padding-left:13px;border-left:1px solid var(--line)}
.metric b{font-family:var(--mono);font-size:22px;font-weight:500;letter-spacing:-.02em;display:block;line-height:1.1;
  text-shadow:0 0 22px rgba(127,168,255,.35)}
.metric b u{font-size:13px;color:var(--ink3);text-decoration:none}
.metric b.tname{font-family:var(--sans);font-size:14px;font-weight:600;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-top:5px}
.metric span{font-size:11px;color:var(--ink2);display:block;margin-top:2px}
.metric .mini{display:flex;gap:7px;margin-top:4px}
.metric .mini i{font-family:var(--mono);font-size:10px;font-style:normal;color:var(--c)}
.topright{display:flex;align-items:center;gap:10px;margin-left:auto}
.saved{font-size:11px;color:var(--eu);opacity:0;transition:opacity .2s}
.saved.on{opacity:1}

/* \uD0ED */
.tabs{display:flex;gap:2px;padding:0 22px;border-bottom:1px solid var(--line);
  background:rgba(4,10,30,.85);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  position:sticky;top:0;z-index:20}
.tabs button{padding:12px 16px;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-1px;font-size:13px;display:flex;align-items:center;gap:7px}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--ink);border-bottom-color:#7FA8FF;text-shadow:0 0 18px rgba(127,168,255,.5)}
.tabs .cnt{font-family:var(--mono);font-size:10.5px;color:var(--ink3);background:var(--raised);padding:1px 6px;border-radius:99px}
.tabs button.on .cnt{color:var(--ink);background:rgba(99,172,255,.28)}

main{padding:18px 22px}

/* \uACF5\uD1B5 */
.panel{background:linear-gradient(180deg,rgba(22,35,88,.5),rgba(8,15,46,.48));
  border:1px solid var(--line);border-radius:10px;padding:15px 17px;margin-bottom:14px;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 10px 30px rgba(1,4,16,.5)}
.panel h3{font-size:13px;margin-bottom:10px}
.stack{display:block}
.bar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:12px;flex-wrap:wrap}
.bar-left{display:flex;align-items:center;gap:8px}
.month{font-size:15px;font-weight:600}
.month .wr{font-family:var(--mono);font-size:11px;color:var(--ink3);margin-left:8px;font-weight:400}
.nav{width:25px;height:25px;border:1px solid var(--line);border-radius:6px;color:var(--ink2);font-size:15px;line-height:1;background:rgba(255,255,255,.04)}
.nav:hover{border-color:var(--line2);color:var(--ink);background:rgba(255,255,255,.09)}
button.primary{background:linear-gradient(180deg,#7FB3FF,#4D84F5);color:#05102F;padding:7px 15px;border-radius:6px;font-weight:700;
  box-shadow:0 4px 16px rgba(77,132,245,.35),inset 0 1px 0 rgba(255,255,255,.4)}
button.primary:hover{background:linear-gradient(180deg,#9CC5FF,#6294FF)}
button.ghost{border:1px solid var(--line);padding:6px 12px;border-radius:6px;color:var(--ink2);background:rgba(255,255,255,.04)}
button.ghost:hover{border-color:var(--line2);color:var(--ink);background:rgba(255,255,255,.09)}
button.danger{border:1px solid rgba(255,111,92,.42);padding:6px 12px;border-radius:6px;color:var(--kr);background:rgba(255,111,92,.08)}
button.sm{padding:4px 9px;font-size:11.5px}
button.full{width:100%;margin-top:8px}
button.x{color:var(--ink3);font-size:15px;line-height:1;padding:0 4px}
button.x:hover{color:var(--kr)}
.row-btn{display:flex;gap:8px;margin-top:10px}
.seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:rgba(255,255,255,.03)}
.seg button{padding:5px 11px;color:var(--ink3);border-right:1px solid var(--line)}
.seg button:last-child{border-right:none}
.seg button.on{background:rgba(99,172,255,.22);color:var(--ink)}
.seg.sm button{padding:3px 9px;font-size:11px}
.empty{color:var(--ink3);font-size:12px;padding:14px 2px}
.hint{color:var(--ink3);font-size:11px;margin-top:5px;line-height:1.5}
.hint.pad{margin-top:10px}
.dim{color:var(--ink3)}
.sm{font-size:11.5px}
.field{display:block}
.flabel{display:block;font-size:11px;color:var(--ink2);margin-bottom:4px}
.form{display:grid;gap:9px}
.form.g2{grid-template-columns:1fr 1fr}
.form.g6{grid-template-columns:repeat(6,1fr)}
.mtag{font-family:var(--mono);font-size:10px;color:var(--c);border:1px solid color-mix(in srgb,var(--c) 55%,transparent);
  background:color-mix(in srgb,var(--c) 14%,transparent);border-radius:4px;padding:1px 5px;letter-spacing:.02em}
.mtag.sm{font-size:9.5px;padding:0 4px}

/* \uD45C */
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{text-align:left;font-weight:500;font-size:11px;color:var(--ink3);padding:5px 7px;border-bottom:1px solid var(--line)}
.tbl td{padding:5px 7px;border-bottom:1px solid var(--soft);vertical-align:top}
.tbl tbody tr:hover{background:rgba(127,168,255,.09)}
.tbl tr.open{background:rgba(127,168,255,.13)}
.tbl .rk{font-family:var(--mono);color:var(--ink3);width:24px;text-align:right}
.tbl .nm em{font-family:var(--mono);font-size:10.5px;color:var(--ink3);font-style:normal;margin-left:5px}
.tbl .mv{width:42px;font-family:var(--mono);font-size:11px}
.tbl .ch{text-align:right;width:62px}
.tbl .thesis{color:var(--ink2);max-width:280px}
.tbl.wide td{padding:6px 7px}
.mv .up{color:var(--kr)} .mv .down{color:var(--us)} .mv .flat{color:var(--ink3)}
.mv .new{color:var(--jp);font-size:10px}
.chg{font-family:var(--mono);font-size:12px;color:color-mix(in srgb,var(--ink2),var(--hot) calc(var(--heat)*100%));
  text-shadow:0 0 calc(var(--heat)*14px) color-mix(in srgb,var(--hot) calc(var(--heat)*60%),transparent)}
select.inline{border:none;background:transparent;padding:2px 2px;font-size:11.5px;width:auto;color:var(--ink2)}

/* IPO */
.ipo-wrap{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
.dow{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;font-size:11px;color:var(--ink3);padding-bottom:5px}
.dow>div{padding-left:5px}
.dow .wknd{color:var(--ink3);opacity:.6}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:10px;overflow:hidden;
  box-shadow:0 10px 30px rgba(1,4,16,.5)}
.cell{background:rgba(13,23,64,.6);min-height:84px;padding:4px 4px 5px;cursor:pointer}
.cell.out{background:rgba(5,11,36,.6)}
.cell.out .dnum{color:#5A69A6}
.cell:hover{background:rgba(127,168,255,.14)}
.cell.picked{outline:1px solid #7FA8FF;outline-offset:-1px;background:rgba(127,168,255,.1)}
.cell .dnum{font-family:var(--mono);font-size:11px;color:var(--ink2);padding:1px 4px}
.cell.today .dnum{background:linear-gradient(180deg,#7FB3FF,#4D84F5);color:#05102F;border-radius:4px;display:inline-block;font-weight:700;
  box-shadow:0 0 14px rgba(99,172,255,.5)}
.evts{display:flex;flex-direction:column;gap:2px;margin-top:3px}
.evt{border-left:2px solid var(--c);background:color-mix(in srgb,var(--c) 18%,transparent);padding:2px 5px;border-radius:0 4px 4px 0;font-size:10.5px;line-height:1.35;overflow:hidden}
.evt:hover{background:color-mix(in srgb,var(--c) 34%,transparent)}
.evt b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.evt i{font-style:normal;color:var(--c);font-size:9.5px}
.side{display:block}
.up{list-style:none;margin:0;padding:0}
.up li{display:flex;align-items:center;gap:7px;padding:6px 2px;border-bottom:1px solid var(--soft);cursor:pointer;font-size:12px}
.up li:hover{background:rgba(127,168,255,.1)}
.up .dleft{font-family:var(--mono);font-size:10.5px;color:var(--ink3);width:38px}
.up .uname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.up .ukind{font-size:10.5px;color:var(--ink2)}
.up .udate{font-family:var(--mono);font-size:10.5px;color:var(--ink3)}

/* \uB7AD\uD0B9 */
.cols{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}
.col .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--c);margin-right:6px}
.colhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.colhead h3{margin:0;display:flex;align-items:center}
.paste{margin-bottom:10px}
.preview{font-family:var(--mono);font-size:11px;color:var(--eu);margin-top:6px}
.dropped{margin-top:8px;font-size:11px;color:var(--ink3);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.dropped span{color:var(--ink3);opacity:.7}
.dropped em{font-style:normal;text-decoration:line-through;text-decoration-color:var(--ink3)}
.fillstat{font-size:11.5px;color:var(--ink2)}
.fillstat b{font-family:var(--mono);color:var(--ink)}
.freq{display:flex;flex-direction:column}
.frow{display:grid;grid-template-columns:32px minmax(0,1fr) auto 40px 62px 90px;gap:10px;align-items:center;padding:5px 2px;border-bottom:1px solid var(--soft);font-size:12px}
.frow:hover{background:rgba(127,168,255,.09)}
.fname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fname em{font-family:var(--mono);font-size:10.5px;color:var(--ink3);font-style:normal;margin-left:5px}
.sparks{display:flex;gap:2px}
.sparks i{width:5px;height:13px;background:rgba(126,148,220,.2);border-radius:2px;display:block}
.sparks i.on{background:var(--c);box-shadow:0 0 8px color-mix(in srgb,var(--c) 55%,transparent)}
.fhits,.fbest,.fsum{font-family:var(--mono);font-size:11px;color:var(--ink2);text-align:right}
.fbest{color:var(--ink3)}

/* \uC720\uB2C8\uBC84\uC2A4 */
.tools{display:flex;gap:8px;align-items:center}
.search{width:170px;padding:4px 8px;font-size:11.5px}
.hitbadge{font-family:var(--mono);font-size:10.5px;color:var(--c);border:1px solid color-mix(in srgb,var(--c) 45%,transparent);
  background:color-mix(in srgb,var(--c) 13%,transparent);padding:1px 6px;border-radius:99px}
tr.detail td{background:rgba(2,6,22,.55);padding:10px 12px}
.noteadd{display:flex;gap:8px;margin-bottom:8px}
.notes{list-style:none;margin:0;padding:0}
.notes li{display:flex;gap:9px;align-items:baseline;padding:4px 0;border-bottom:1px solid var(--soft);font-size:12px}
.notes li>span:nth-child(2){flex:1;color:var(--ink2)}
.nwk{font-family:var(--mono);font-size:10.5px;color:var(--ink3);flex-shrink:0}

/* \uBE45\uB770 */
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.theme{border-top:2px solid var(--ink3)}
.theme.ph-0{border-top-color:var(--eu)}
.theme.ph-1{border-top-color:var(--us)}
.theme.ph-2{border-top-color:var(--kr)}
.theme.ph-3{border-top-color:var(--ink3);opacity:.7}
.thead{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.thead h3{flex:1;margin:0}
.phase{color:var(--ink2)}
.strength{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.sbar{flex:1;height:6px;background:rgba(126,148,220,.18);border-radius:99px;overflow:hidden}
.sbar i{display:block;height:100%;background:linear-gradient(90deg,#6294FF,#9E7BFF 60%,var(--hot));border-radius:99px;
  box-shadow:0 0 12px rgba(127,168,255,.45)}
.snum{font-family:var(--mono);font-size:13px}
.slab{font-size:10.5px;color:var(--ink3)}
.tthesis{margin:0 0 5px;font-size:12px;color:var(--ink2)}
.tcheck{margin:0 0 9px;font-size:11.5px;color:var(--ink3)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chips .chip{font-size:11px;border:1px solid var(--line);border-radius:99px;padding:2px 8px;color:var(--ink2);
  background:rgba(255,255,255,.04);display:inline-flex;align-items:center;gap:5px}
.chips .chip.hot{border-color:rgba(255,127,95,.5);background:rgba(255,127,95,.12);color:var(--ink)}
.chips .chip b{font-family:var(--mono);font-size:10px;color:var(--hot)}
.chips .chip .uv{width:4px;height:4px;border-radius:50%;background:var(--eu);display:inline-block}
.tlog{margin-top:10px;padding-top:10px;border-top:1px solid var(--soft)}

/* \uB77D\uC5C5 */
.chk{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink2)}
.chk input[type=checkbox]{width:auto;accent-color:#78B8FF}
.chk .unit{width:74px;padding:3px 7px;font-size:11.5px;margin-left:6px}
.mbars{display:flex;align-items:flex-end;gap:8px;height:92px;padding-top:14px}
.mbars.tall{height:128px}
.mbar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;position:relative}
.mbar i{width:100%;max-width:38px;background:linear-gradient(180deg,#78B8FF,#4D7BE0);border-radius:4px 4px 0 0;min-height:2px;
  box-shadow:0 0 14px rgba(120,184,255,.3)}
.mbar i.neg{background:linear-gradient(180deg,#FF9E86,#E0563C)}
.mbar .mn{font-family:var(--mono);font-size:10.5px;color:var(--ink2);margin-bottom:3px}
.mbar .ml{font-family:var(--mono);font-size:10px;color:var(--ink3);margin-top:5px}
.colist{list-style:none;margin:0;padding:0;max-height:460px;overflow-y:auto}
.colist li{border-bottom:1px solid var(--soft)}
.cohead{display:flex;align-items:center;gap:7px;padding:7px 2px;cursor:pointer;font-size:12px}
.cohead:hover{background:rgba(127,168,255,.09)}
.colist li.open .cohead{background:rgba(127,168,255,.12)}
.cocnt{font-family:var(--mono);font-size:10px;color:var(--ink3);background:var(--raised);border-radius:99px;padding:0 6px}
.cobody{padding:6px 2px 10px}
.lrow{display:grid;grid-template-columns:auto 36px minmax(0,1fr) 42px 60px auto;gap:7px;align-items:center;padding:3px 0;font-size:11.5px}
.lrow input[type=checkbox]{width:auto;accent-color:#78B8FF}
.lrow.off{opacity:.4}
.lday{font-family:var(--mono);font-size:10.5px;color:var(--ink3)}
.lday.x{color:var(--jp)}
.llab{color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ldate{font-family:var(--mono);font-size:10.5px;color:var(--ink)}
.lvol{padding:2px 5px;font-size:10.5px}
.xadd{display:grid;grid-template-columns:1fr 1fr 60px auto;gap:5px;margin-top:8px;padding-top:8px;border-top:1px solid var(--soft)}
.xadd input{padding:3px 6px;font-size:11px}

/* \uC138\uC774\uBE0C\uB85C */
.sb-wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
.tbl th.r,.tbl td.r{text-align:right}
.tbl .num{font-family:var(--mono);font-size:12px}
.tbl .num.big{font-size:15px}
.pos{color:var(--hot)} .neg{color:var(--us)}
.tbl.mt{margin-top:10px}
h3.mt{margin-top:16px}
.frow.sb{grid-template-columns:minmax(0,1fr) auto 40px 62px 84px;cursor:pointer}
.frow.hi{grid-template-columns:32px minmax(0,1fr) 44px}
.tsline{display:flex;align-items:flex-end;gap:5px;height:110px;padding-top:16px}
.tsp{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.tsp i{width:100%;max-width:26px;background:linear-gradient(180deg,var(--jp),rgba(255,208,122,.35));border-radius:3px 3px 0 0}
.tsr{font-family:var(--mono);font-size:10px;color:var(--ink2);margin-bottom:3px}
.tsk{font-family:var(--mono);font-size:9.5px;color:var(--ink3);margin-top:4px}

/* \uC2E0\uACE0\uAC00 */
.hi-form{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.hi-grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:14px;align-items:start}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart .gl{stroke:rgba(140,162,232,.14);stroke-width:1}
.chart .gt{fill:#96A5DC;font-size:9px;font-family:var(--mono)}
.chart .gv{font-size:10px;font-family:var(--mono);font-weight:600}
.heatnum{color:color-mix(in srgb,var(--ink2),var(--hot) calc(var(--heat,0)*100%))}

label.ghost.imp{cursor:pointer;display:inline-block}
label.ghost.imp input{display:none}
.syncbtn{display:inline-flex;align-items:center;gap:6px}
.sdot{width:6px;height:6px;border-radius:50%;background:var(--ink3);flex-shrink:0}
.syncbtn.ok .sdot{background:var(--eu);box-shadow:0 0 8px var(--eu)}
.syncbtn.busy .sdot{background:var(--jp);box-shadow:0 0 8px var(--jp)}
.syncbtn.err .sdot{background:var(--kr);box-shadow:0 0 8px var(--kr)}
.syncpanel{border-color:var(--line2)}
.syncmsg{font-family:var(--mono);font-size:11px;color:var(--ink3);margin-top:9px}
.syncmsg.ok{color:var(--eu)} .syncmsg.err{color:var(--kr)} .syncmsg.busy{color:var(--jp)}
.app button:disabled{opacity:.35;cursor:default}

/* AI \uBA85\uB839\uCC3D */
.panel.agent{border-color:rgba(127,168,255,.34);
  background:linear-gradient(180deg,rgba(38,58,132,.5),rgba(10,18,54,.5));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.09),0 10px 34px rgba(1,4,16,.5)}
.abar{display:flex;align-items:center;gap:9px}
.aicon{color:#9CC5FF;font-size:14px;flex-shrink:0;text-shadow:0 0 12px rgba(127,168,255,.7)}
.abar input{flex:1;padding:9px 12px;font-size:13px;border-radius:8px;background:rgba(2,6,22,.55)}
.abar input:disabled{opacity:.55}
.acfg{margin-top:11px;padding-top:11px;border-top:1px solid var(--soft)}
.amsg{margin-top:11px;font-size:12.5px;color:var(--ink2);line-height:1.6;white-space:pre-wrap;
  padding-left:11px;border-left:2px solid var(--line2)}
.amsg.err{color:var(--kr);border-left-color:var(--kr)}
.apend{margin-top:11px;padding:11px 13px;border:1px solid rgba(127,168,255,.34);border-radius:8px;
  background:rgba(2,6,22,.45)}
.apsum{font-size:12.5px;color:var(--ink);margin-bottom:8px}
.aplist{list-style:none;margin:0 0 4px;padding:0}
.aplist li{font-size:11.5px;color:var(--ink2);padding:3px 0 3px 15px;position:relative;font-family:var(--mono)}
.aplist li:before{content:"\u2192";position:absolute;left:0;color:#78B8FF}
.ausage{margin-top:9px;font-family:var(--mono);font-size:10.5px;color:var(--ink3)}

/* \uC14B\uC5C5 */
.setup-stats{display:flex;align-items:center;gap:26px;flex-wrap:wrap}
.sstat b{font-family:var(--mono);font-size:20px;font-weight:500;display:block;line-height:1.1;color:var(--c,var(--ink))}
.sstat b u{font-size:12px;color:var(--ink3);text-decoration:none}
.sstat span{font-size:10.5px;color:var(--ink2);display:block;margin-top:2px}
.tools.right{margin-left:auto}
button.ghost.on{border-color:#78B8FF;color:var(--ink);background:rgba(120,184,255,.16)}
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:start}
.bcol{background:linear-gradient(180deg,rgba(22,35,88,.34),rgba(8,15,46,.3));border:1px solid var(--line);
  border-radius:10px;padding:10px 10px 12px}
.bhead{display:flex;align-items:center;gap:7px;padding:2px 2px 9px;border-bottom:1px solid var(--soft);margin-bottom:9px}
.bhead h3{flex:1;margin:0;font-size:12.5px}
.bhead .dot{width:7px;height:7px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c)}
.bcnt{font-family:var(--mono);font-size:10.5px;color:var(--ink3);background:var(--raised);border-radius:99px;padding:0 7px}
.bempty{font-size:11px;color:var(--ink3);padding:8px 2px}
.scard{background:rgba(8,16,48,.5);border:1px solid var(--line);border-left:2px solid var(--c);
  border-radius:8px;padding:9px 10px;margin-bottom:8px}
.scard.todo{box-shadow:inset 2px 0 0 rgba(255,255,255,.14)}
.scard.open{border-color:var(--line2);background:rgba(12,24,68,.7)}
.shead{display:flex;align-items:center;gap:7px;cursor:pointer}
.sname{flex:1;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sname em{font-family:var(--mono);font-size:10px;color:var(--ink3);font-style:normal;margin-left:5px}
.sdplus{font-family:var(--mono);font-size:10px;color:var(--ink3)}
.smeta{margin-top:5px;font-size:11px;color:var(--ink2);display:flex;gap:7px;flex-wrap:wrap}
.smeta b{font-family:var(--mono);color:var(--ink);font-weight:500}
.sstrip{display:flex;gap:2px;margin:8px 0 8px}
.sstrip i{flex:1;height:11px;border-radius:2px;background:rgba(140,162,232,.13)}
.sstrip i.on{background:var(--c);box-shadow:0 0 7px color-mix(in srgb,var(--c) 55%,transparent)}
.sbtns{display:flex;gap:5px}
.sbtns button{flex:1;padding:4px 0;border:1px solid var(--line);border-radius:5px;color:var(--ink3);font-size:11px}
.sbtns button:hover{border-color:var(--c);color:var(--c)}
.sbtns button.cur{color:var(--c);border-color:color-mix(in srgb,var(--c) 40%,transparent)}
.sbtns button.on{background:color-mix(in srgb,var(--c) 22%,transparent);border-color:var(--c);color:var(--ink)}
.sbody{margin-top:9px;padding-top:9px;border-top:1px solid var(--soft)}
.lstate{font-size:10px;color:var(--c);border:1px solid color-mix(in srgb,var(--c) 40%,transparent);
  background:color-mix(in srgb,var(--c) 12%,transparent);border-radius:99px;padding:0 6px;flex-shrink:0}

@media (max-width:1100px){
  .ipo-wrap{grid-template-columns:1fr}
  .sb-wrap,.hi-grid{grid-template-columns:1fr}
  .cols{grid-template-columns:repeat(2,minmax(0,1fr))}
  .frow{grid-template-columns:30px minmax(0,1fr) auto 36px 56px;}
  .frow .fsum{display:none}
}
@media (max-width:640px){
  .cols{grid-template-columns:1fr}
  .board{grid-template-columns:1fr}
  .form.g6,.form.g2{grid-template-columns:1fr 1fr}
  .hi-form{grid-template-columns:1fr 1fr}
  .metrics{gap:18px}
  .cell{min-height:64px}
  .evt i{display:none}
  main{padding:14px}
  .top{padding:14px}
  .tabs{padding:0 10px;overflow-x:auto}
}
@media (prefers-reduced-motion:reduce){.app *{transition:none!important}}
